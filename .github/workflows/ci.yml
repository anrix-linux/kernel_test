name: Build Custom Linux Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel stable version tag'
        required: true
        default: 'v6.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "5G"

    steps:
      - name: Maximize build disk space
        run: |
          echo "==> Free disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get autoremove -y -qq
          sudo apt-get clean
          echo "==> Free disk space after cleanup:"
          df -h /

      - name: Install build toolchain and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            kmod \
            cpio \
            rsync \
            dwarves \
            ccache \
            zstd

      - name: Setup ccache caching
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Shallow clone kernel source
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || 'v6.12' }}"
          git clone --depth 1 --branch "$KERNEL_VER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux-src

      - name: Configure kernel and apply speed overrides
        working-directory: linux-src
        run: |
          # Use defconfig as the base
          make defconfig

      - name: Upload kernel defconfig
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: ${{ github.workspace }}/linux-src/.config
          retention-days: 7
