name: Build Custom Linux Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel stable version tag'
        required: true
        default: 'v6.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "5G"

    steps:
      - name: Maximize build disk space
        run: |
          echo "==> Free disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get autoremove -y -qq
          sudo apt-get clean
          echo "==> Free disk space after cleanup:"
          df -h /

      - name: Install build toolchain and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            kmod \
            cpio \
            rsync \
            dwarves \
            ccache \
            zstd

      - name: Setup ccache caching
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Shallow clone kernel source
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || 'v6.12' }}"
          git clone --depth 1 --branch "$KERNEL_VER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux-src

      - name: Configure kernel and apply speed overrides
        working-directory: linux-src
        run: |
          # Use defconfig as the base
          make defconfig

          # Disable debug symbols (major build accelerator and space saver)
          ./scripts/config --disable DEBUG_INFO
          ./scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable DEBUG_INFO_DWARF4
          ./scripts/config --disable DEBUG_INFO_DWARF5
          ./scripts/config --disable DEBUG_INFO_BTF

          # Enable essential modern subsystems for modern desktop distros
          ./scripts/config --enable NAMESPACES
          ./scripts/config --enable CGROUPS
          ./scripts/config --enable BLK_DEV_NVME
          ./scripts/config --enable EXT4_FS
          ./scripts/config --enable BTRFS_FS
          ./scripts/config --enable VFAT_FS
          ./scripts/config --enable DRM_I915

          # Resolve and sync dependencies
          make olddefconfig

      - name: Compile kernel and modules
        working-directory: linux-src
        run: |
          ccache -z
          ccache -s

          NPROC=$(nproc)
          echo "Compiling using $NPROC vCPUs..."

          # Compile using ccache wrappers
          make -j"$NPROC" CC="ccache gcc" bzImage modules

          echo "==> Post-build ccache stats:"
          ccache -s

      - name: Package artifacts
        working-directory: linux-src
        run: |
          mkdir -p ${{ github.workspace }}/distro-output/boot
          
          # Copy bzImage
          cp arch/x86/boot/bzImage ${{ github.workspace }}/distro-output/boot/vmlinuz-custom
          cp .config ${{ github.workspace }}/distro-output/boot/config-custom

          # Install modules stripped to reduce size
          make INSTALL_MOD_PATH=${{ github.workspace }}/distro-output INSTALL_MOD_STRIP=1 modules_install

          # Create a compressed tarball for deployment
          cd ${{ github.workspace }}/distro-output
          tar -I 'zstd -T0 -19' -cf ${{ github.workspace }}/kernel-release.tar.zst boot lib

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-linux-kernel
          path: ${{ github.workspace }}/kernel-release.tar.zst
          retention-days: 7
